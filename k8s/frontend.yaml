apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: visits
  labels: { app: frontend }
spec:
  replicas: 2
  selector:
    matchLabels: { app: frontend }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      containers:
        - name: frontend
          image: visits-frontend:1.0
          imagePullPolicy: IfNotPresent # image locale chargée dans minikube
          ports: [{ containerPort: 8080 }]
          env:
            - { name: API_URL, value: "http://api:80" }   # Service "api" du même namespace
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { cpu: 200m, memory: 64Mi }
          readinessProbe:
            httpGet: { path: /, port: 8080 }
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: visits
spec:
  type: ClusterIP
  selector: { app: frontend }
  ports:
    - port: 80                         # port du Service
      targetPort: 8080                 # port nginx dans le conteneur
