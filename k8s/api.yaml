apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: visits
  labels: { app: api }
spec:
  replicas: 3                          # 3 pods identiques
  selector:
    matchLabels: { app: api }          # gère les pods qui ont ce label
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }   # zéro coupure
  template:                            # le modèle de pod
    metadata:
      labels: { app: api }
    spec:
      containers:
        - name: api
          image: visits-api:1.0
          imagePullPolicy: IfNotPresent # image locale chargée dans minikube
          ports: [{ containerPort: 8000 }]
          envFrom:
            - configMapRef: { name: api-config }
            - secretRef: { name: api-secret }
          resources:
            requests: { cpu: 100m, memory: 128Mi }   # réservé (sert au scheduler et au HPA)
            limits: { cpu: 500m, memory: 256Mi }     # plafond
          readinessProbe:              # prêt à recevoir du trafic ?
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:               # toujours vivant ? sinon redémarré
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: visits
spec:
  type: ClusterIP                      # interne ; NodePort/LoadBalancer pour exposer directement
  selector: { app: api }
  ports:
    - port: 80                         # port du Service
      targetPort: 8000                 # port du conteneur