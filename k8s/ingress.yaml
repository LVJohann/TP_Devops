apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api
  namespace: visits
spec:
  ingressClassName: nginx
  rules:
    - host: visits.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: frontend, port: { number: 80 } }   # le frontend relaie /api/* vers l'API