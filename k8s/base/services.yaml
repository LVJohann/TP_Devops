apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: taskflow-dev
spec:
  selector: {app: postgres}
  ports: [{port: 5432, targetPort: 5432}]
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: taskflow-dev
spec:
  selector: {app: backend}
  ports: [{port: 5000, targetPort: 5000}]
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: taskflow-dev
spec:
  type: NodePort
  selector: {app: frontend}
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
