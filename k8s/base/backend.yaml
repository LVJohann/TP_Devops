apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: taskflow-dev
spec:
  replicas: 1
  selector:
    matchLabels: {app: backend}
  template:
    metadata:
      labels: {app: backend}
    spec:
      # Pour un dépôt Docker Hub privé, décommenter après création du secret regcred :
      # imagePullSecrets:
      #   - name: regcred
      containers:
        - name: backend
          image: DOCKERHUB_USER/taskflow-backend:IMAGE_TAG
          ports: [{containerPort: 5000}]
          env:
            - name: DB_HOST
              value: postgres
            - name: POSTGRES_DB
              valueFrom: {secretKeyRef: {name: postgres-secret, key: POSTGRES_DB}}
            - name: POSTGRES_USER
              valueFrom: {secretKeyRef: {name: postgres-secret, key: POSTGRES_USER}}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: postgres-secret, key: POSTGRES_PASSWORD}}
