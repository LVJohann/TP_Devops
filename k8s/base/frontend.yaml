apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: taskflow-dev
spec:
  replicas: 1
  selector:
    matchLabels: {app: frontend}
  template:
    metadata:
      labels: {app: frontend}
    spec:
      # Pour un dépôt Docker Hub privé, décommenter après création du secret regcred :
      # imagePullSecrets:
      #   - name: regcred
      containers:
        - name: frontend
          image: DOCKERHUB_USER/taskflow-frontend:IMAGE_TAG
          ports: [{containerPort: 80}]
